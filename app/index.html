<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Avocado Money</title>
<meta name="description" content="Grow your savings like an avocado tree: track spending and income, hit goals, level up.">
<meta name="theme-color" content="#F5F2E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B2312" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Avocado Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Main">
    <a href="#/home" data-tab="home" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg>
      <span>Home</span>
    </a>
    <a href="#/activity" data-tab="activity" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01" /></svg>
      <span>Activity</span>
    </a>
    <a href="#/add" data-tab="add" class="tab tab-add" aria-label="Add expense">
      <span class="tab-add-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></span>
    </a>
    <a href="#/goals" data-tab="goals" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22c4.4 0 7-3.6 7-8.5C19 8 16 2 12 2S5 8 5 13.5C5 18.4 7.6 22 12 22z" /><circle cx="12" cy="14.5" r="3" /></svg>
      <span>Goals</span>
    </a>
    <a href="#/tree" data-tab="tree" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-7" /><path d="M9 22h6" /><path d="M12 15c-4.5 0-7-2.6-7-6a5 5 0 0 1 3.2-4.7A4.5 4.5 0 0 1 12 2a4.5 4.5 0 0 1 3.8 2.3A5 5 0 0 1 19 9c0 3.4-2.5 6-7 6z" /></svg>
      <span>Tree</span>
    </a>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="receipt-input" accept="image/*" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
